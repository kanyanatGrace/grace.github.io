<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NASA Data Visualizations</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.5/d3.layout.cloud.min.js"></script>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }
        svg {
            width: 100%;
            height: 400px;
            margin-bottom: 40px;
        }
        #mars-map svg {
            background-color: #222;
        }
    </style>
</head>
<body>
    <h1>NASA Data Visualizations</h1>

    <h2>Asteroid Diameters</h2>
    <div id="asteroid-bar-chart"></div>

    <h2>Mars Rover Landing Map</h2>
    <div id="mars-map"></div>

    <h2>Rover Camera Word Cloud</h2>
    <div id="rover-word-cloud"></div>

    <script src="script.js"></script>
</body>
</html>
